<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام الرقم الوطني | السجل المدني</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .card-white {
            background: #fff; border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,.05), 0 8px 10px -6px rgba(0,0,0,.05);
        }
        .view { animation: fadeIn .25s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .view { animation: none; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-xl card-white rounded-2xl p-6 md:p-8">

        <!-- الصفحة الأولى: الاستعلام -->
        <section id="searchView" class="view">
            <div class="text-center mb-6">
                <h1 class="text-2xl md:text-3xl font-bold text-blue-900 mb-2">استعلام الرقم الوطني</h1>
                <p class="text-gray-500 text-sm">أدخل الرقم الوطني المكون من 11 رقماً لعرض البيانات الرسمية</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label for="queryValue" class="block text-sm font-semibold text-gray-700 mb-1">الرقم الوطني (11 رقم)</label>
                    <input type="text" id="queryValue" maxlength="11" inputmode="numeric" autocomplete="off"
                        placeholder="أدخل الرقم الوطني هنا..."
                        class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-300 text-gray-900 placeholder-gray-400 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                    <p id="inputError" class="hidden text-red-600 text-xs font-semibold mt-2">الرجاء إدخال رقم وطني صحيح يتكون من 11 رقماً.</p>
                </div>
                <button id="submitBtn" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow-md transition">
                    إرسال الاستعلام
                </button>
            </div>
        </section>

        <!-- الصفحة الثانية: النتيجة -->
        <section id="resultView" class="view hidden">
            <div class="text-center mb-5">
                <h1 class="text-xl md:text-2xl font-bold text-blue-900">نتيجة الاستعلام</h1>
                <p class="text-gray-500 text-sm mt-1">الرقم الوطني: <span id="queriedNumber" class="font-semibold text-gray-800" dir="ltr"></span></p>
            </div>

            <!-- حالة التحميل -->
            <div id="loadingBox" class="p-6 rounded-xl text-center text-sm font-semibold bg-blue-50 text-blue-700 border border-blue-200 flex items-center justify-center gap-2">
                <svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>جاري معالجة الطلب، يرجى الانتظار...</span>
            </div>

            <!-- خطأ -->
            <div id="errorBox" class="hidden p-4 rounded-xl text-center text-sm font-semibold bg-red-50 text-red-700 border border-red-200"></div>

            <!-- البيانات -->
            <div id="dataBox" class="hidden bg-gray-50 border border-gray-200 rounded-xl p-4">
                <div class="flex justify-between items-center mb-3 border-b border-gray-200 pb-2">
                    <span class="text-sm font-bold text-gray-800">الحالة:</span>
                    <span id="updateBadge" class="text-xs px-2 py-1 rounded-md border font-bold"></span>
                </div>
                <div id="resultTable" class="space-y-2"></div>
            </div>

            <button id="backBtn" class="w-full mt-5 py-3 rounded-xl bg-white hover:bg-gray-50 text-blue-700 border border-blue-600 font-bold transition">
                استعلام جديد
            </button>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://apryy-ac426-default-rtdb.firebaseio.com/" });
        const db = getDatabase(app);

        const $ = (id) => document.getElementById(id);
        const searchView = $("searchView"), resultView = $("resultView");
        const queryInput = $("queryValue"), inputError = $("inputError");
        const loadingBox = $("loadingBox"), errorBox = $("errorBox"), dataBox = $("dataBox");
        const resultTable = $("resultTable"), updateBadge = $("updateBadge");

        let unsubscribe = null;

        function showView(view) {
            searchView.classList.toggle("hidden", view !== "search");
            resultView.classList.toggle("hidden", view !== "result");
            window.scrollTo(0, 0);
        }

        function stopListening() {
            if (unsubscribe) { unsubscribe(); unsubscribe = null; }
        }

        function resetResult() {
            loadingBox.classList.remove("hidden");
            errorBox.classList.add("hidden");
            dataBox.classList.add("hidden");
            resultTable.innerHTML = "";
        }

        function showError(msg) {
            loadingBox.classList.add("hidden");
            dataBox.classList.add("hidden");
            errorBox.textContent = "❌ " + msg;
            errorBox.classList.remove("hidden");
        }

        function row(label, value) {
            const div = document.createElement("div");
            div.className = "flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-3 rounded-lg border border-gray-200 gap-1";
            const l = document.createElement("span");
            l.className = "text-xs font-bold text-gray-500";
            l.textContent = label;
            const v = document.createElement("span");
            v.className = "text-sm font-semibold text-gray-900";
            v.textContent = value;
            div.append(l, v);
            return div;
        }

        function titleRow(text) {
            const div = document.createElement("div");
            div.className = "bg-white p-3 rounded-lg border border-gray-200 text-center text-sm font-semibold text-blue-900";
            div.textContent = text;
            return div;
        }

        function renderResult(raw) {
            const cleaned = (raw || "").replace(/[*`]/g, "").replace(/[-—]{3,}/g, "").trim();
            const lines = cleaned.split("\n").map(l => l.trim()).filter(l => /[\p{L}\p{N}]/u.test(l));

            let englishName = "";
            resultTable.innerHTML = "";
            lines.forEach(line => {
                const parts = line.split(":");
                if (parts.length >= 2) {
                    const label = parts[0].trim();
                    const value = parts.slice(1).join(":").trim();
                    if (label.includes("الاسم بالإنجليزية") || label.toLowerCase().includes("english")) {
                        englishName = value;
                    }
                    resultTable.appendChild(row(label, value));
                } else {
                    resultTable.appendChild(titleRow(line));
                }
            });

            // محدث: اسم إنجليزي موجود (4 حروف أو أكثر) | غير محدث: غير موجود أو أقل من 4 حروف
            const letters = englishName.replace(/[^A-Za-z]/g, "");
            if (letters.length >= 4) {
                updateBadge.className = "text-xs px-2 py-1 rounded-md border font-bold bg-green-50 text-green-600 border-green-200";
                updateBadge.textContent = "محدث";
            } else {
                updateBadge.className = "text-xs px-2 py-1 rounded-md border font-bold bg-red-50 text-red-600 border-red-200";
                updateBadge.textContent = "غير محدث";
            }

            loadingBox.classList.add("hidden");
            errorBox.classList.add("hidden");
            dataBox.classList.remove("hidden");
        }

        function sendInquiry() {
            const queryVal = queryInput.value.trim();
            if (!/^\d{11}$/.test(queryVal)) {
                inputError.classList.remove("hidden");
                queryInput.focus();
                return;
            }
            inputError.classList.add("hidden");

            // اخفاء صفحة الاستعلام وعرض صفحة النتيجة
            stopListening();
            resetResult();
            $("queriedNumber").textContent = queryVal;
            showView("result");

            const newRequestRef = push(ref(db, "inquiries"));
            set(newRequestRef, {
                query_value: queryVal,
                status: "pending",
                timestamp: Date.now()
            }).then(() => {
                unsubscribe = onValue(ref(db, `inquiries/${newRequestRef.key}`), (snapshot) => {
                    const data = snapshot.val();
                    if (!data) return;
                    if (data.status === "completed") {
                        renderResult(data.result);
                        stopListening();
                    } else if (data.status === "failed") {
                        showError("حدث خطأ: " + (data.result || "فشل المعالجة"));
                        stopListening();
                    }
                });
            }).catch((error) => {
                console.error("Error writing to Firebase:", error);
                showError("فشل الاتصال بقاعدة البيانات.");
            });
        }

        function newInquiry() {
            stopListening();
            resetResult();
            queryInput.value = "";
            inputError.classList.add("hidden");
            showView("search");
            queryInput.focus();
        }

        $("submitBtn").addEventListener("click", sendInquiry);
        $("backBtn").addEventListener("click", newInquiry);
        queryInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendInquiry(); });
        queryInput.addEventListener("input", () => {
            queryInput.value = queryInput.value.replace(/\D/g, "");
            inputError.classList.add("hidden");
        });
    </script>
</body>
</html>
